name: Notify Claude plugin directory

# The Claude plugin directory checks the tracked branch on a schedule; this
# sends it the push as GitHub's own push webhook would (the event JSON, signed
# with HMAC-SHA256 in X-Hub-Signature-256), so it checks without waiting.
on:
  push:
    branches: [main]

permissions: {}

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send push event
        env:
          WEBHOOK_URL: ${{ secrets.ANTHROPIC_PLUGIN_WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ secrets.ANTHROPIC_PLUGIN_WEBHOOK_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "$WEBHOOK_URL" ] || [ -z "$WEBHOOK_SECRET" ]; then
            echo "::error::ANTHROPIC_PLUGIN_WEBHOOK_URL and ANTHROPIC_PLUGIN_WEBHOOK_SECRET must both be set"
            exit 1
          fi
          signature=$(openssl dgst -sha256 -hmac "$WEBHOOK_SECRET" -r "$GITHUB_EVENT_PATH" | cut -d' ' -f1)
          curl --fail-with-body --silent --show-error --max-time 30 \
            -X POST "$WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -H "User-Agent: GitHub-Hookshot/actions" \
            -H "X-GitHub-Event: push" \
            -H "X-GitHub-Delivery: $(cat /proc/sys/kernel/random/uuid)" \
            -H "X-Hub-Signature-256: sha256=$signature" \
            --data-binary "@$GITHUB_EVENT_PATH"
